name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: ChatGTP Code Review
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          LANGUAGE: Korean
          MODEL: gpt-4o-mini
          PROMPT: |
            당신은 시니어 풀스택 개발자입니다.
            PR의 변경 사항을 리뷰하고 버그, 성능 개선점, 가독성을 중심으로 피드백을 제공해 주세요.
            반드시 한국어로 답변해 주세요.
