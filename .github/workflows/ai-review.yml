name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions: write-all

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: PR Info
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Repository: ${{ github.repository }}"
          echo "Action Type: ${{ github.event.action }}"

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini AI Review
        uses: truongnh1992/gemini-ai-code-reviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-1.5-flash # 속도가 빠르고 비용 효율적입니다. 심층 분석 필요 시 gemini-1.5-pro 변경 가능
          EXCLUDE: "*.md,*.txt,package-lock.json,yarn.lock,*.yml,*.yaml,dist/*"
          PROMPT: |
            당신은 시니어 풀스택 개발자입니다.
            제시된 PR의 diff를 바탕으로 코드 리뷰를 진행해 주세요.
            1. 버그나 논리적 오류 가능성
            2. 성능 개선 포인트 및 가독성
            3. 보안 취약점
            위 요소들을 중심으로 피드백을 제공해 주시고, 반드시 한국어로 답변해 주세요.