name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR의 변경 사항(diff)을 리뷰하고 아래 항목에 대해
            파일:라인 기준으로 인라인 코멘트를 남겨줘.

            1. 로직 오류 및 엣지 케이스
            2. 보안 취약점 (SQL 인젝션, 인증/인가 우회, 시크릿 하드코딩)
            3. 성능 이슈 (N+1 쿼리, 불필요한 블로킹 호출)
            4. 예외 처리 누락
            5. 이 프로젝트의 CLAUDE.md 컨벤션 준수 여부

            사소한 스타일 문제보다 실제로 버그나 보안 문제로
            이어질 수 있는 부분에 집중해줘.