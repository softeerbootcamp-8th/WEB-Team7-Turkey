name: Deploy to WAS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Build
        working-directory: ./backend
        run: ./gradlew clean build -x test

      - name: Upload jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: ./deploy

      - name: Configure JVM diagnostics (heap dump + GC logging)
        # myapp.service 원본 파일은 저장소 밖(EC2)에만 있어 내용을 알 수 없으므로,
        # 원본을 건드리지 않는 systemd override로 얹는다(#374). -Xmx228m은 지금 ergonomic
        # 기본값(총 메모리 906MiB의 25%, #259 실측)과 동일한 값으로 고정하는 것— 힙 자체를
        # 늘리는 게 아니라서 "단독 증설은 스와핑 위험" 판단과 충돌하지 않는다.
        run: |
          mkdir -p /home/ubuntu/app/dumps
          sudo mkdir -p /etc/systemd/system/myapp.service.d
          sudo tee /etc/systemd/system/myapp.service.d/jvm-diagnostics.conf > /dev/null <<'EOF'
          [Service]
          Environment="JAVA_TOOL_OPTIONS=-Xmx228m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/ubuntu/app/dumps/heapdump.hprof -Xlog:gc*:file=/home/ubuntu/app/dumps/gc.log:time,uptime,level,tags:filecount=5,filesize=20m"
          EOF
          sudo systemctl daemon-reload

      - name: Deploy jar and restart service
        run: |
          mkdir -p /home/ubuntu/app
          JAR=$(ls ./deploy/*.jar | grep -v -- '-plain' | head -n 1)
          echo "Deploying: $JAR"
          cp "$JAR" /home/ubuntu/app/app.jar
          sudo systemctl restart myapp.service

      - name: Verify service is running
        run: |
          sleep 10
          systemctl is-active myapp.service

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Slack
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            STATUS="배포 실패 (빌드 단계)"; COLOR="#e01e5a"
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            STATUS="배포 실패 (배포 단계)"; COLOR="#e01e5a"
          else
            STATUS="배포 성공"; COLOR="#2eb886"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"attachments\":[{\"color\":\"${COLOR}\",\"title\":\"${STATUS}\",\"fields\":[{\"title\":\"브랜치\",\"value\":\"${{ github.ref_name }}\",\"short\":true},{\"title\":\"실행자\",\"value\":\"${{ github.actor }}\",\"short\":true}],\"actions\":[{\"type\":\"button\",\"text\":\"로그 보기\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}]}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}