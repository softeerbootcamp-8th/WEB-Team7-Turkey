name: Backend CI

on:
  # main 배포 워크플로가 이 CI를 호출한다. CI와 CD를 독립된 push 워크플로로 만들면
  # 동시에 실행되어 테스트 실패가 배포를 막지 못하므로 workflow_call로 연결한다.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local
          MYSQL_DATABASE: turkey
          MYSQL_USER: turkey
          MYSQL_PASSWORD: local
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=30s

      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=10s

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report-${{ github.run_id }}
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: |
            backend/build/libs/*.jar
            !backend/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 7
