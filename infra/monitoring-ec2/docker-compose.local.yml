# EC2에 올리기 전 로컬에서 스택 전체를 돌려보기 위한 오버레이.
#
#   SITE_ADDRESS=https://localhost \
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   ./verify-local.sh          # 이 스크립트는 SITE_ADDRESS 를 알아서 넣어 준다
#   docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
#
# 파일명을 docker-compose.override.yml 로 하지 않은 것은 의도적이다 — 그 이름이면 EC2에서
# `docker compose up` 만 해도 자동으로 끼어든다.
#
# 바꾸는 것은 **대상 주소와 접속정보뿐**이다. prometheus.yml·rules·provisioning·loki-config 는
# 배포와 같은 파일을 그대로 쓴다. 그래서 여기서 통과하면 EC2에서 남는 변수는 사설 IP 와
# 보안그룹뿐이다.
services:
  prometheus:
    # 배포와 달리 호스트 포트를 9099 로 뺀다 — backend/docker-compose.yml 의 s3mock 이 9090 을
    # 쓰기 때문에, 앱 스택과 모니터링 스택을 같이 띄우면 9090 이 충돌한다.
    ports: !override
      - "127.0.0.1:9099:9090"
    volumes:
      # 배포 대상(사설 IP) 대신 아래 로컬 컨테이너들을 가리킨다.
      - ./targets.local:/etc/prometheus/targets:ro
    # targets.local/spring-app.yml 이 호스트의 bootRun(8081)을 겨냥한다. macOS 는 자동으로
    # 해석되지만 Linux 는 이 매핑이 없으면 안 된다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    environment:
      # .env 없이도 뜨도록 기본값을 준다(로컬 전용).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local}

  caddy:
    environment:
      # base 는 `${SITE_ADDRESS:-}` 라 값이 없으면 **빈 문자열**을 넘긴다. 그런데 Caddyfile 의
      # `{$SITE_ADDRESS:https://localhost}` 는 변수가 "설정됐지만 비어 있는" 경우 기본값으로
      # 넘어가지 않는다 — 주소가 사라져 `{ tls internal ... }` 가 되고, 맨 앞의 `{` 를 전역
      # 옵션 블록으로 읽어 `unrecognized global option: tls` 로 **기동이 실패한다**.
      # verify-local.sh 는 이 값을 직접 넣어 주지만, `docker compose up -d` 를 손으로 치면
      # 걸린다(실제로 걸렸다). 로컬 오버레이는 로컬임을 아니까 여기서 기본값을 준다.
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost}
    # !override 가 없으면 base 의 443 에 8443 이 "추가"되어 443 을 그대로 점유한다.
    ports: !override
      # 443 은 권한·기존 프로세스와 충돌하기 쉬워 로컬에서만 8443 으로 뺀다.
      - "8443:443"

  mysqld-exporter:
    volumes:
      - ./.my.cnf.local:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  # --- 아래는 로컬에만 존재하는 "가짜 EC2들" ---

  # 앱 EC2·Redis EC2의 node_exporter 역할. 호스트 루트를 마운트해야 실제 디스크·파일시스템
  # 지표가 나온다(DiskAlmostFull 규칙과 Node Exporter 대시보드가 그 위에서 돈다).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  redis:
    image: redis:7.4

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: turkey
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
