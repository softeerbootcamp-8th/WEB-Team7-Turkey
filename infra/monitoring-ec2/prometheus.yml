# <...-사설IP> 자리는 실제 배포 전에 이 VPC의 실제 사설 IP로 바꿔넣는다.
# Prometheus 는 설정 파일의 env var 치환을 지원하지 않아서(docker-compose 와 다름)
# 값을 직접 적어야 한다.
#
# 스크레이프 대상 주소는 전부 targets/*.yml 로 뺐다. 두 가지 이득이 있다:
#  - 앱을 스케일 아웃할 때 목록만 고치면 되고, Prometheus 가 파일 변경을 감지해 재시작이 없다.
#  - 이 파일이 환경에 독립적이라, 로컬 검증(docker-compose.local.yml)이 대상 파일만 바꿔 끼우고
#    **배포와 완전히 같은 설정**을 돌려볼 수 있다.
# 규칙(rules/*.yml)을 고쳤을 때만 reload 가 필요하다: curl -X POST http://localhost:9090/-/reload
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 앱 자체 지표(JVM, GC, HTTP 처리시간, DB 커넥션 풀) — application.yml 의 management.server.port
  # Actuator 는 /actuator/prometheus 로 노출한다. 기본값(/metrics)으로 두면 404 만 긁어
  # 대상이 up=1 인데 지표는 하나도 안 들어오는 상태가 된다.
  - job_name: spring-app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/spring-app.yml]

  # 앱 EC2 호스트 지표(CPU, 메모리, 디스크, 네트워크)
  - job_name: node-app
    file_sd_configs:
      - files: [/etc/prometheus/targets/node-app.yml]

  # Redis EC2 호스트 지표
  - job_name: node-redis
    file_sd_configs:
      - files: [/etc/prometheus/targets/node-redis.yml]

  # Redis 자체 지표(커넥션 수, 메모리, hit/miss)
  - job_name: redis
    file_sd_configs:
      - files: [/etc/prometheus/targets/redis.yml]

  # DB 지표 — mysqld-exporter 는 이 compose 안에서 같이 뜨므로 서비스명으로 접근한다
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
