# 팀 공유 모니터링 스택. public 서브넷의 별도 EC2 한 대에서 이 compose 만 띄운다.
# 실행: docker compose up -d --build
#
# 대상(앱 EC2, Redis EC2, DB)은 전부 이 EC2와 같은 VPC 안에 있고 Docker 없이 프로세스로
# 떠 있다 — 그쪽엔 Node Exporter/Promtail/redis_exporter 를 네이티브 systemd 로 설치한다
# (../app-ec2, ../redis-ec2 참고). 이 EC2만 새로 만드는 박스라 Docker 를 자유롭게 쓴다.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 스크레이프 대상(앱 인스턴스 목록)과 알림 규칙. 대상 파일은 Prometheus 가 변경을
      # 스스로 감지하고, 규칙은 /-/reload 로 반영한다.
      - ./targets:/etc/prometheus/targets:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # k6 가 SSH 터널로 원격 write 로 부하테스트 결과를 여기로 직접 push 한다.
      - --web.enable-remote-write-receiver
      # 규칙 파일을 고친 뒤 재시작 없이: curl -X POST http://localhost:9090/-/reload
      # (9090 은 루프백 바인딩이라 외부에서 호출할 수 없다)
      - --web.enable-lifecycle
      # 기본값과 같은 15일이지만, 디스크를 실제로 지켜 주는 건 아래 size 상한이다.
      # 둘 중 먼저 걸리는 쪽이 적용된다. EC2 볼륨 크기에 맞춰 조정할 것.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
    # 루프백만 바인딩 — k6 를 로컬에서 돌리는 사람이 SSH 터널(-L 9090:localhost:9090)로만
    # 접근하고, 외부(팀원 브라우저 포함)에는 노출하지 않는다. Grafana 는 같은 docker
    # 네트워크 안에서 서비스명(prometheus:9090)으로 바로 붙으므로 별도 포트 공개가 필요 없다.
    ports:
      - "127.0.0.1:9090:9090"

  # 앱 EC2·Redis EC2는 별도 호스트(다른 compose 프로젝트)라 Docker 내부망으로 안 닿는다.
  # 반드시 실제 호스트 포트로 열어야 한다 — 보안그룹에서 각 EC2 사설 IP만 허용해서 막는다.
  loki:
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # 이미지 기본 설정에는 retention 이 없어 로그가 무제한 쌓인다 — loki-config.yaml 참고.
    command:
      - -config.file=/etc/loki/config.yaml

  # DB(EC2 직접 설치든 RDS든) 에는 아무것도 설치하지 않고, 여기서 MySQL 프로토콜로
  # 접속해 지표를 뽑는다. 읽기전용 계정(PROCESS, REPLICATION CLIENT)의 접속정보는
  # .my.cnf 로 넘긴다 — v0.15.1 부터 DATA_SOURCE_NAME 환경변수를 안 읽는다.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    volumes:
      - ./.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
      # 복제(replica) 구성이 아니라서 불필요 + MySQL 8.4는 SHOW SLAVE STATUS 를 없애고
      # SHOW REPLICA STATUS 로 바꿔서 이 버전의 exporter(8.4 이전 빌드)가 계속 syntax error 를 냄.
      - --no-collect.slave_status

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    expose:
      - "3000"      # 호스트에 직접 안 열고 caddy 뒤에서만 접근
    depends_on:
      - prometheus
      - loki

  caddy:
    image: caddy:2.8-alpine
    environment:
      # 팀원이 브라우저에 실제로 입력하는 주소(IP 든 도메인이든). 예시 Caddyfile 이 이 값을
      # 쓰지만, IP 로 접속하는 경우 SNI 가 비어 오므로(RFC 6066, SNI 는 IP 를 못 담는다)
      # `default_sni` 를 같이 지정해야 한다 — 실제 운영에서 이 문제로 핸드셰이크가
      # "internal error"로 끊긴 적이 있다. 자세한 Caddyfile 패턴은 README 참고.
      # required(:?)로 두지 않는다 — Caddyfile 을 다른 방식(하드코딩 주소 등)으로 이미
      # 구성했다면 이 값이 없어도 되는데, required 로 두면 그 경우에도 `docker compose`
      # 명령 자체가 매번 실패한다(파일 전체를 파싱할 때 검증하므로 caddy 를 안 건드려도 걸린다).
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - grafana

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  caddy-data:
