# uid 를 고정하는 이유: grafana.com 에서 받은 대시보드 JSON 이 데이터소스를 uid 로 참조한다.
# fetch-dashboards.sh 가 JSON 의 ${DS_PROMETHEUS} 자리를 아래 uid 로 치환한다 — uid 를 바꾸면
# 그 스크립트도 함께 고쳐야 한다.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
