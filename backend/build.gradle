plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.turkey'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // OpenAPI 문서 자동 생성. /v3/api-docs 의 스펙을 프론트 Orval 이 그대로 읽어
    // API 클라이언트를 생성하므로, 컨트롤러 어노테이션이 곧 프론트 계약이 된다.
    // 버전 고정 이유: 2.8.17 은 이 조합(Boot 3.4.1 / Spring 6.2)에서 swagger-ui 리소스 핸들러가
    // "/swagger-ui/**/*swagger-initializer.js" 패턴을 등록해 PathPatternParser 가 거부하고
    // 애플리케이션이 아예 기동하지 못한다. 2.7.0 은 기동·문서·UI 모두 정상 동작을 확인했다.
    // 올릴 때는 반드시 로컬 기동과 /v3/api-docs 응답을 확인하고 올린다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // DB 스키마 버전 관리. flyway-core 만 있으면 앱 기동 시 db/migration 의
    // 마이그레이션이 자동 실행된다(별도 Gradle 플러그인 불필요).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // 로컬·배포 모두 MySQL 을 사용한다(로컬은 Docker 컨테이너, docs/05-local-dev.md 참고).
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
