# 로컬 개발용 MySQL.
# 배포(EC2)와 같은 8.4 / utf8mb4 / UTC 로 맞춰, 로컬에서만 통과하고 배포에서 깨지는
# 스키마·타입 문제를 로컬에서 잡는 것이 목적이다(H2 사용 시 TINYINT(1) 처리 차이로
# 실제 배포 장애가 있었다).
#
# 사용법은 docs/05-local-dev.md 참고.
# 여기의 계정/비밀번호는 로컬 컨테이너 전용이며 배포 접속 정보와 무관하다.

services:
  mysql:
    image: mysql:8.4
    container_name: turkey-mysql-local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: turkey
      MYSQL_USER: turkey
      MYSQL_PASSWORD: local
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 마이그레이션의 DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) 와
      # 애플리케이션의 LocalDateTime.now(ZoneOffset.UTC) 기준을 일치시킨다.
      - --default-time-zone=+00:00
    volumes:
      - turkey-mysql-data:/var/lib/mysql
    healthcheck:
      # 컨테이너가 떴어도 초기화 중에는 접속이 안 되므로, ping 이 통해야 healthy 로 본다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: turkey-redis-local
    ports:
      - "6379:6379"
    # 주의: 개발 PC 에 Redis 를 직접 설치하지 않는다(Homebrew 등). 호스트 Redis 는
    # 127.0.0.1:6379 에 바인딩하고 컨테이너는 *:6379 에 바인딩하는데, 더 구체적인 호스트 쪽이
    # 이기기 때문이다. 그러면 localhost:6379 로 붙는 애플리케이션·테스트가 컨테이너가 아니라
    # 호스트 인스턴스에 **조용히** 연결된다 — 2026-07-29 에 실제로 그 상태로 테스트가 돌고
    # 있었다(호스트 8.8.0 vs 컨테이너 7.4). H2 로 통과하고 MySQL 에서 깨졌던 것과 같은 종류의
    # 문제라, 통합·E2E 테스트의 RedisCleaner 가 연결된 인스턴스의 버전을 확인해 이 상황을 막는다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 배송 완료 인증 사진 로컬 개발용 S3 호환 서버.
  # 버킷은 컨테이너 시작 시 생성하므로 별도 AWS CLI 초기화가 필요 없다.
  s3mock:
    image: adobe/s3mock:5.1.0
    container_name: turkey-s3mock-local
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-2
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: turkey-delivery-proof-local

  # 부하 테스트용 spring 앱 컨테이너. 기본 `docker compose up -d` 에는 안 끼고,
  # `--profile app` 을 줘야만 뜬다 — 평소 로컬 개발(bootRun)에는 영향 없음.
  # `docker compose --profile app up -d --build --scale app=3` 처럼 여러 대로 늘릴 수 있다.
  # ports 를 범위로 잡은 건 인스턴스마다 고정 호스트 포트를 하나씩 배정받게 하기 위함이다
  # (호스트에서 도구로 특정 인스턴스를 직접 겨냥해 때릴 수 있다).
  app:
    build: .
    profiles: ["app"]
    # 배포 EC2(1GiB / 2 vCPU)와 같은 자원으로 묶는다. 호스트에서 bootRun 으로 재면 개발 PC의
    # CPU·메모리를 다 쓰므로 배포 환경의 한계를 볼 수 없다(실제로 처리량이 자릿수로 달라진다 —
    # loadtest/README.md 의 두 측정 비교).
    # JVM 힙은 일부러 지정하지 않는다: 컨테이너 인식 기본값(메모리의 25% ≈ 256MiB)이고,
    # 배포도 1GiB EC2 에서 옵션 없이 `java -jar` 라 같은 값이 나온다.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    ports:
      - "8080-8089:8080"
      # Actuator(지표) 포트. Prometheus 가 이걸 긁는다(infra/monitoring-ec2 의
      # targets.local/spring-app.yml). 고정 매핑이라 --scale app=2 이상은 이 줄을 지우거나
      # 범위로 바꿔야 한다 — 대신 bootRun 과 포트가 같아 둘을 동시에 띄우는 실수가 막힌다.
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/turkey?tinyInt1isBit=false
      DB_USERNAME: turkey
      DB_PASSWORD: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RIDER_DELIVERY_PROOF_STORAGE: s3mock
      AWS_S3_ENDPOINT: http://s3mock:9090
      AWS_S3_BUCKET: turkey-delivery-proof-local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_started

  # k6 부하 테스트 결과 시각화용. `--profile loadtest` 로 별도로 켠다(app profile 과 독립적).
  influxdb:
    image: influxdb:1.8
    profiles: ["loadtest"]
    environment:
      INFLUXDB_DB: k6

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["loadtest"]
    ports:
      - "3000:3000"
    environment:
      # 로컬 1회성 부하테스트 시각화 용도라 익명 admin 허용 — 팀 공유용 모니터링은
      # infra/monitoring-ec2 쪽(개별 로그인 계정)을 쓴다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

  # 실행: docker compose --profile loadtest run --rm k6 run /scripts/<파일명>.js
  # ./loadtest/ 에 시나리오 스크립트를 직접 작성해서 넣는다(리포지토리에는 없음).
  #
  # 모니터링 스택(infra/monitoring-ec2)의 Prometheus 로 결과를 보낼 수 있다. 개발 PC 쪽 포트는
  # 9099 로 통일한다 — 이 파일의 s3mock 이 9090 을 쓰기 때문이다.
  #   로컬 스택: docker-compose.local.yml 이 이미 127.0.0.1:9099 로 노출한다.
  #   실 EC2   : ssh -N -L 9099:localhost:9090 <모니터링-EC2> &   (그쪽 9090 은 루프백 바인딩)
  # 그다음:
  #   K6_OUT=experimental-prometheus-rw \
  #   K6_PROMETHEUS_RW_SERVER_URL=http://host.docker.internal:9099/api/v1/write \
  #     docker compose --profile loadtest run --rm k6 run /scripts/<파일명>.js
  # 컨테이너에서 호스트의 터널을 타려고 host.docker.internal 을 쓰므로 extra_hosts 가 필요하다.
  # 출력 이름은 k6 버전에 따라 다를 수 있다(experimental- 접두어 제거 예정) — 안 먹으면
  # `docker compose --profile loadtest run --rm k6 --help` 로 확인할 것.
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts
    environment:
      K6_OUT: ${K6_OUT:-influxdb=http://influxdb:8086/k6}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-}
      # 기본값은 avg/min/med/max 뿐이라 p99 가 안 올라간다. 부하테스트에서 볼 값은 p99 다.
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),max
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb
    entrypoint: ["k6"]

volumes:
  turkey-mysql-data:
  grafana-data:
