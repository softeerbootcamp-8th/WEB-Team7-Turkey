# 로컬 개발용 MySQL.
# 배포(EC2)와 같은 8.4 / utf8mb4 / UTC 로 맞춰, 로컬에서만 통과하고 배포에서 깨지는
# 스키마·타입 문제를 로컬에서 잡는 것이 목적이다(H2 사용 시 TINYINT(1) 처리 차이로
# 실제 배포 장애가 있었다).
#
# 사용법은 docs/05-local-dev.md 참고.
# 여기의 계정/비밀번호는 로컬 컨테이너 전용이며 배포 접속 정보와 무관하다.

services:
  mysql:
    image: mysql:8.4
    container_name: turkey-mysql-local
    # 배포 DB EC2(t3.micro = 2 vCPU / 1 GiB)와 같은 자원으로 묶는다(CLAUDE.md 「인프라·배포」).
    # 앱만 묶고 DB·Redis 를 풀어 두면 부하테스트가 **DB 쪽 병목을 구조적으로 과소평가한다** —
    # 개발 PC 의 11코어/8.8GiB 를 DB 가 다 쓰기 때문이다(2026-08-11 실측으로 확인해 추가).
    # 로컬 개발(bootRun)만 할 때도 이 제한이 걸리지만, 배포와 같은 조건이라 문제가 아니다.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: turkey
      MYSQL_USER: turkey
      MYSQL_PASSWORD: local
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 마이그레이션의 DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) 와
      # 애플리케이션의 LocalDateTime.now(ZoneOffset.UTC) 기준을 일치시킨다.
      - --default-time-zone=+00:00
    volumes:
      - turkey-mysql-data:/var/lib/mysql
    healthcheck:
      # 컨테이너가 떴어도 초기화 중에는 접속이 안 되므로, ping 이 통해야 healthy 로 본다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: turkey-redis-local
    # 위 mysql 과 같은 이유. Redis EC2 의 인스턴스 타입은 CLAUDE.md 에 적혀 있지 않은데,
    # micro 계열(t3/t4g)은 어느 쪽이든 2 vCPU / 1 GiB 라 값 자체는 같다 — 타입이 확정되면
    # 이 주석만 고치면 된다.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    ports:
      - "6379:6379"
    # 주의: 개발 PC 에 Redis 를 직접 설치하지 않는다(Homebrew 등). 호스트 Redis 는
    # 127.0.0.1:6379 에 바인딩하고 컨테이너는 *:6379 에 바인딩하는데, 더 구체적인 호스트 쪽이
    # 이기기 때문이다. 그러면 localhost:6379 로 붙는 애플리케이션·테스트가 컨테이너가 아니라
    # 호스트 인스턴스에 **조용히** 연결된다 — 2026-07-29 에 실제로 그 상태로 테스트가 돌고
    # 있었다(호스트 8.8.0 vs 컨테이너 7.4). H2 로 통과하고 MySQL 에서 깨졌던 것과 같은 종류의
    # 문제라, 통합·E2E 테스트의 RedisCleaner 가 연결된 인스턴스의 버전을 확인해 이 상황을 막는다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 배송 완료 인증 사진 로컬 개발용 S3 호환 서버.
  # 버킷은 컨테이너 시작 시 생성하므로 별도 AWS CLI 초기화가 필요 없다.
  s3mock:
    image: adobe/s3mock:5.1.0
    container_name: turkey-s3mock-local
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-2
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: turkey-delivery-proof-local

  # 부하 테스트용 spring 앱 컨테이너. 기본 `docker compose up -d` 에는 안 끼고,
  # `--profile app` 을 줘야만 뜬다 — 평소 로컬 개발(bootRun)에는 영향 없음.
  # `docker compose --profile app up -d --build --scale app=3` 처럼 여러 대로 늘릴 수 있다.
  # ports 를 범위로 잡은 건 인스턴스마다 고정 호스트 포트를 하나씩 배정받게 하기 위함이다
  # (호스트에서 도구로 특정 인스턴스를 직접 겨냥해 때릴 수 있다).
  app:
    build: .
    profiles: ["app"]
    # 배포 EC2(1GiB / 2 vCPU)와 같은 자원으로 묶는다. 호스트에서 bootRun 으로 재면 개발 PC의
    # CPU·메모리를 다 쓰므로 배포 환경의 한계를 볼 수 없다(실제로 처리량이 자릿수로 달라진다 —
    # loadtest/README.md 의 두 측정 비교).
    # JVM 힙은 일부러 지정하지 않는다: 컨테이너 인식 기본값(메모리의 25% ≈ 256MiB)이고,
    # 배포도 1GiB EC2 에서 옵션 없이 `java -jar` 라 같은 값이 나온다.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    ports:
      - "8080-8089:8080"
      # Actuator(지표) 포트. Prometheus 가 이걸 긁는다(infra/monitoring-ec2 의
      # targets.local/spring-app.yml). 고정 매핑이라 --scale app=2 이상은 이 줄을 지우거나
      # 범위로 바꿔야 한다 — 대신 bootRun 과 포트가 같아 둘을 동시에 띄우는 실수가 막힌다.
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/turkey?tinyInt1isBit=false
      DB_USERNAME: turkey
      DB_PASSWORD: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RIDER_DELIVERY_PROOF_STORAGE: s3mock
      AWS_S3_ENDPOINT: http://s3mock:9090
      AWS_S3_BUCKET: turkey-delivery-proof-local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_started

  # 부하 발생기. 시나리오는 ./loadtest/local/(로컬 대상) · ./loadtest/remote/(배포 대상)에 있고, 결과는 로컬 모니터링 스택의 Prometheus 로
  # 밀어 넣는다(아래 K6_OUT 기본값). 관측·시각화는 전부 그쪽이 한다 — 이 파일에 influxdb·
  # grafana 를 따로 두지 않는 이유다(로컬에 Grafana 가 둘이면 어느 쪽을 보는지 헷갈린다).
  #
  # k6 가 이 프로젝트에 있는 이유: 측정 경로(k6 → app → mysql/redis)가 한 docker 네트워크
  # 안에서 끝나야 한다. 호스트를 경유하면 macOS·Windows 에서 Docker VM 경계를 넘어 지연이
  # 붙고, 그게 요청이 커넥션을 잡는 시간에 그대로 더해진다(loadtest/README.md 「측정 이력」의
  # 철회된 첫 결론이 정확히 이 함정이었다). 반대로 결과 전송·스크레이프는 측정 경로가
  # 아니므로 호스트를 경유해도 수치에 영향이 없다.
  #
  # 실행(부하 대상은 app 컨테이너다 — 호스트 bootRun 으로 재지 말 것):
  #   cd ../infra/monitoring-ec2 && docker compose \
  #     -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.loadtest.yml up -d
  #   curl -sf localhost:9099/-/ready || echo "관측 스택이 안 떠 있다 — 리포트가 빈다"
  #   cd ../../backend && docker compose --profile app up -d --build
  #   S=$(date +%s)
  #   docker compose run --rm -e BASE_URL=http://app:8080 k6 \
  #     run --tag testid=location-$(date +%Y%m%d-%H%M%S) /scripts/local/rider-location-update.js
  #   ./loadtest/collect.py $S $(date +%s) location-<위와 같은 값>
  #
  # `--tag testid=` 를 빼먹지 말 것: Grafana k6 대시보드가 그 라벨로 런을 구분하고,
  # collect.py 도 그것으로 런을 특정한다. 없으면 여러 런이 한 그래프에 겹친다.
  #
  # 배포 EC2 의 Prometheus 로는 절대 밀지 않는다. 그쪽 보존 정책이 `15d 또는 8GB 중 먼저
  # 걸리는 쪽`인데, k6 시리즈는 카디널리티가 높고(URL·check·status × testid, 런마다 새 testid)
  # 8GB 에 닿으면 Prometheus 는 오래된 블록부터 지운다 — k6 와 운영 지표를 구분하지 않는다.
  k6:
    image: grafana/k6:latest
    # `up -d` 가 이걸 띄우지 않게 막는 용도다. `docker compose run k6` 는 대상 서비스의
    # 프로파일을 자동으로 켜므로(Compose v2 이상) 실행할 때 --profile 을 줄 필요가 없다.
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts
    environment:
      # 출력 이름은 k6 v2.1.0 에서 실측 확인했다(`prometheus-rw` 는 아직 없다).
      K6_OUT: ${K6_OUT:-experimental-prometheus-rw}
      # 로컬 모니터링 스택의 Prometheus. 9099 인 이유는 이 파일의 s3mock 이 9090 을 쓰기 때문.
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://host.docker.internal:9099/api/v1/write}
      # 기본값은 avg/min/med/max 뿐이라 p99 가 안 올라간다. 부하테스트에서 볼 값은 p99 다.
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),max
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["k6"]

volumes:
  turkey-mysql-data:
