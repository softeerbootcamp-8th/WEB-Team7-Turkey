# 단위 테스트용 설정: DB 없이 컨텍스트를 띄운다.
# DB가 필요한 통합 테스트는 별도 프로파일/설정으로 real MySQL 에 붙인다(Docker 금지 정책).
# 경로 탐색은 테스트에서 절대 실제 카카오 API 를 부르지 않는다 — 호출당 과금이라 CI·로컬 어디서도
# 테스트 실행이 돈으로 이어지면 안 된다(#431 확정). 그래서 아무도 듣지 않는 주소를 가리켜 둔다
# (포트 1 은 특권 포트라 사실상 비어 있다). 스텁 서버가 필요한 테스트는 각자 주소를 넘겨
# KakaoMobilityRoutingClient 를 직접 만든다.
#
# api-key 에 가짜 값을 넣는 것은 의도다. 비어 있으면 클라이언트가 호출 자체를 건너뛰어,
# "라우팅 서버에 못 닿아도 앱이 정상 동작한다"는 통합 테스트가 연결 실패 경로를 지나가지 않는다.
routing:
  base-url: http://localhost:1
  api-key: test-key-never-sent-to-kakao

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
