# 단위 테스트용 설정: DB 없이 컨텍스트를 띄운다.
# DB가 필요한 통합 테스트는 별도 프로파일/설정으로 real MySQL 에 붙인다(Docker 금지 정책).
# 경로 탐색(OSRM)은 테스트에서 절대 실제 서버를 부르지 않는다. 개발 PC 에 OSRM 이 떠 있든 아니든
# 결과가 같아야 하므로, 아무도 듣지 않는 주소를 가리켜 둔다(포트 1 은 특권 포트라 사실상 비어 있다).
# 스텁 서버가 필요한 테스트는 각자 주소를 넘겨 OsrmRoutingClient 를 직접 만든다.
routing:
  base-url: http://localhost:1

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
