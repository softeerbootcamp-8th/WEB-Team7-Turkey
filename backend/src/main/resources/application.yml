spring:
  application:
    name: quick-delivery

  # --- DB 연결 (MySQL 8.4 / 스키마명 turkey) ---
  # 접속 정보는 환경 변수로 주입한다(비밀정보 커밋 금지).
  # tinyInt1isBit=false: Connector/J 는 기본값(true)에서 TINYINT(1) 컬럼을 Types.BIT 으로
  # 보고한다. 그러면 boolean 컬럼(term.is_required/is_active, member_term_agreement.agreed)이
  # 엔티티의 @JdbcTypeCode(TINYINT) 와 어긋나 ddl-auto=validate 가 기동 시 실패한다.
  # 표시폭에 따라 타입이 바뀌지 않도록 끄고, TINYINT 을 있는 그대로 받는다.
  # ※ DB_URL 을 환경 변수로 주입하는 배포 환경에서는 그 URL 에도 이 파라미터가 있어야 한다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/turkey?tinyInt1isBit=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # --- Redis: 세션 저장 / 라이더 최신 위치(TTL 10분) / GEO 배차 후보 검색 /
  #            휴대전화 인증번호(TTL) / SSE 이벤트 팬아웃(Pub/Sub, #317) ---
  # 팬아웃은 클러스터 모드 비활성을 전제로 한다 — RedisMessageListenerConfig javadoc 참고.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # --- 비동기 응답(SSE) 타임아웃 ---
  # 이 값은 SSE 동작을 바꾸지 않는다 — SseEmitter 를 타임아웃 인자로 만들면 그 값이 이겨서
  # 요청별로 적용된다(CustomerTrackingStreamController.TTL_MILLIS). 그래도 명시하는 이유는 둘이다:
  #   1. 미설정이면 Tomcat 기본값 30초가 적용된다는 함정을 설정 파일에서 읽을 수 있게 한다.
  #      new SseEmitter() 로 만든 스트림은 이벤트가 흐르고 있어도 30초에 끊긴다(쓰기로 갱신되지
  #      않는다).
  #   2. 앞으로 추가되는 다른 async 엔드포인트의 기본값이 된다.
  mvc:
    async:
      request-timeout: 300000    # 5분. CustomerTrackingStreamController.TTL_MILLIS 와 같은 값

  # --- Flyway: 스키마 버전 관리 ---
  # datasource 가 채워지면 앱 기동 시 db/migration 의 마이그레이션이 자동 실행된다.
  # (지금은 datasource 가 비어 있어 Flyway 도 동작하지 않음 — 배선만 된 상태)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- JPA: 스키마는 Flyway가 만들고, JPA는 검증만 한다 ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- 배송 완료 인증 사진 업로드(#61 후속) ---
  # 의도적으로 넉넉하게 열어 둔다 — docs/worklog/2026-08-04-61-delivery-completion-proof.md 참고.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# --- 경로 탐색(OSRM): ETA·예상 경로 산정 ---
# 서울시 행정구역만 전처리한 자체 호스팅 OSRM 이다(#416). Redis 인스턴스에 co-locate 돼 있고
# WAS 보안그룹에서만 접근할 수 있어 개발 PC 에서는 닿지 않는다 — 로컬은 application-local.yml 참고.
# 이 서버가 죽어도 애플리케이션은 정상 기동한다(호출 시점에만 접속하고, 실패는 OsrmRoutingClient 가
# 빈 값으로 흡수한다).
routing:
  base-url: ${ROUTING_BASE_URL:http://10.0.130.0:5000}

# --- S3: 배송 완료 인증 사진 저장 ---
# 자격 증명은 기본 프로바이더 체인(환경변수/인스턴스 프로파일)을 쓴다. 버킷은 배포 시 환경변수로 채운다.
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:web-team7-turkey-data-962895253643-ap-northeast-2-an}
    region: ${AWS_REGION:ap-northeast-2}

server:
  port: 8080

# --- Actuator: 모니터링(Prometheus)용 지표 노출 ---
# 별도 포트로 분리해, 보안그룹에서 앱 포트(8080)와 독립적으로 접근을 제한할 수 있게 한다.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
# --- 공개 접근 도메인 ---
# CloudFront가 EC2로 요청을 넘길 때 Host 헤더를 오리진(EC2) 도메인으로 덮어써서,
# springdoc이 자동 추론하는 OpenAPI 서버 URL이 EC2 주소로 잡힌다(OpenApiConfig 참고).
# 그래서 실제 공개 도메인을 명시적으로 고정한다. 로컬은 application-local.yml에서 비운다.
app:
  public-base-url: https://dw1nqa61d1no6.cloudfront.net

# --- 로그인 세션 쿠키 ---
# Secure는 프로파일별로 다르다: 배포는 CloudFront가 HTTPS를 종단하므로 true,
# 로컬은 http라 브라우저가 Secure 쿠키를 거부하므로 local 프로파일에서 false로 덮어쓴다.
session:
  cookie:
    secure: true

# --- springdoc(OpenAPI) ---
# /v3/api-docs 의 스펙을 프론트 Orval 이 읽어 API 클라이언트를 생성한다.
# 스펙 순서가 요청마다 바뀌면 생성물 diff 가 무의미하게 커지므로 정렬을 고정한다.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  writer-with-order-by-keys: true
