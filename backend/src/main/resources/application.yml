spring:
  application:
    name: quick-delivery

  # --- DB 연결 (MySQL 8.4 / 스키마명 turkey) ---
  # 접속 정보는 환경 변수로 주입한다(비밀정보 커밋 금지).
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/turkey}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # --- Redis: 세션 저장 / 라이더 최신 위치 / GEO 위치 검색 / 휴대전화 인증번호(TTL) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- Flyway: 스키마 버전 관리 ---
  # datasource 가 채워지면 앱 기동 시 db/migration 의 마이그레이션이 자동 실행된다.
  # (지금은 datasource 가 비어 있어 Flyway 도 동작하지 않음 — 배선만 된 상태)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- JPA: 스키마는 Flyway가 만들고, JPA는 검증만 한다 ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# --- springdoc(OpenAPI) ---
# /v3/api-docs 의 스펙을 프론트 Orval 이 읽어 API 클라이언트를 생성한다.
# 스펙 순서가 요청마다 바뀌면 생성물 diff 가 무의미하게 커지므로 정렬을 고정한다.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  writer-with-order-by-keys: true
