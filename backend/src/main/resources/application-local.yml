# 로컬 개발 프로파일.
# 배포(EC2)와 동일한 MySQL 8.4 를 Docker 컨테이너로 띄워 사용한다(backend/docker-compose.yml).
#
# 과거에는 H2 를 MySQL 호환 모드로 썼지만, 엔진이 다르면 로컬에서 통과한 스키마가
# 배포에서만 깨진다(예: TINYINT(1) 을 Connector/J 가 BIT 으로 보고해 ddl-auto=validate 실패).
# 그래서 로컬도 실제 MySQL 로 통일했다. 상세 절차는 docs/05-local-dev.md 참고.
#
# 아래 계정은 docker-compose.yml 의 로컬 컨테이너 전용 계정이다(배포 접속 정보 아님).
# dialect 는 드라이버가 실제 서버 버전을 보고 결정하므로 따로 고정하지 않는다.
spring:
  datasource:
    # tinyInt1isBit=false: TINYINT(1) 을 BIT 이 아닌 TINYINT 으로 받게 한다(배포 URL 과 동일 설정).
    # env var 로 override 가능하게 한다 — 로컬 bootRun 은 기본값(localhost) 그대로 쓰고,
    # docker-compose 로 앱까지 컨테이너로 띄울 때는 DB_URL 등을 서비스명(mysql)으로 넘긴다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/turkey?tinyInt1isBit=false}
    username: ${DB_USERNAME:turkey}
    password: ${DB_PASSWORD:local}

  flyway:
    enabled: true

session:
  cookie:
    secure: false

app:
  public-base-url: ""

# backend 디렉터리에서 실행하면 프로젝트 루트의 data/proof/... 아래에 인증 사진을 저장한다.
rider:
  delivery-proof:
    # local: 호스트 파일시스템, s3mock: 로컬 S3 mock 컨테이너
    storage: ${RIDER_DELIVERY_PROOF_STORAGE:local}
    local-root: ${RIDER_DELIVERY_PROOF_LOCAL_ROOT:../data}

# 로컬에서 실제 경로 응답이 필요하면 #407 처럼 Docker 로 OSRM 을 직접 띄운다(전처리 산출물 필요).
# 띄우지 않아도 앱은 정상 동작한다 — 경로 호출이 실패로 흡수돼 ETA·경로선만 비어 있다.
routing:
  base-url: ${ROUTING_BASE_URL:http://localhost:5000}

logging:
  level:
    com.turkey.quick: DEBUG


aws:
  s3:
    # 1. 기존 상용 버킷 이름 대신, 로컬 테스트용 버킷 이름(예: my-test-bucket)으로 덮어씁니다.
    bucket: web-team7-turkey-data-962895253643-ap-northeast-2-an
    region: ${AWS_REGION:ap-northeast-2}

    # 2. 로컬 테스트 여부를 판별할 엔드포인트 주소를 새로 추가합니다.
    endpoint: http://localhost:9090
    access-key: foo
    secret-key: bar
