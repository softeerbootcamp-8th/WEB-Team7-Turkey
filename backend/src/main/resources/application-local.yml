# 로컬 개발 프로파일.
# 배포(EC2)와 동일한 MySQL 8.4 를 Docker 컨테이너로 띄워 사용한다(backend/docker-compose.yml).
#
# 과거에는 H2 를 MySQL 호환 모드로 썼지만, 엔진이 다르면 로컬에서 통과한 스키마가
# 배포에서만 깨진다(예: TINYINT(1) 을 Connector/J 가 BIT 으로 보고해 ddl-auto=validate 실패).
# 그래서 로컬도 실제 MySQL 로 통일했다. 상세 절차는 docs/05-local-dev.md 참고.
#
# 아래 계정은 docker-compose.yml 의 로컬 컨테이너 전용 계정이다(배포 접속 정보 아님).
# dialect 는 드라이버가 실제 서버 버전을 보고 결정하므로 따로 고정하지 않는다.
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    # tinyInt1isBit=false: TINYINT(1) 을 BIT 이 아닌 TINYINT 으로 받게 한다(배포 URL 과 동일 설정).
    # env var 로 override 가능하게 한다 — 로컬 bootRun 은 기본값(localhost) 그대로 쓰고,
    # docker-compose 로 앱까지 컨테이너로 띄울 때는 DB_URL 등을 서비스명(mysql)으로 넘긴다.
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/turkey?tinyInt1isBit=false}
    username: ${DB_USERNAME:turkey}
    password: ${DB_PASSWORD:local}
    hikari:
      # 최대 커넥션 개수
      maximum-pool-size: 10
      # 풀에 여유 커넥션이 없을 때 대기하는 시간 (밀리초 단위, 30000ms = 30초)
      connection-timeout: 30000
      # 커넥션의 최소 유휴 개수 (기본적으로 maximum-pool-size와 동일하게 맞추는 것을 권장)
      minimum-idle: 10
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

session:
  cookie:
    secure: false

app:
  public-base-url: ""

# backend 디렉터리에서 실행하면 프로젝트 루트의 data/proof/... 아래에 인증 사진을 저장한다.
rider:
  delivery-proof:
    # local: 호스트 파일시스템, s3mock: 로컬 S3 mock 컨테이너
    storage: ${RIDER_DELIVERY_PROOF_STORAGE:s3mock}
    local-root: ${RIDER_DELIVERY_PROOF_LOCAL_ROOT:../data}

# 배포 OSRM(#416)은 WAS 보안그룹에서만 닿는다 — 로컬 PC 에서 실제 경로가 필요하면 #407 처럼
# Docker 로 직접 띄우고 ROUTING_BASE_URL 을 그쪽으로 돌린다. 안 띄워도 앱은 정상 동작한다
# (경로 호출이 실패로 흡수되어 ETA 만 빈다).
routing:
  base-url: ${ROUTING_BASE_URL:http://localhost:5000}

logging:
  level:
    com.turkey.quick: DEBUG


aws:
  s3:
    # Docker S3Mock이 시작할 때 같은 이름의 로컬 전용 버킷을 생성한다.
    bucket: ${AWS_S3_BUCKET:turkey-delivery-proof-local}
    region: ${AWS_REGION:ap-northeast-2}
    # 호스트 bootRun은 localhost, app 컨테이너는 AWS_S3_ENDPOINT=http://s3mock:9090을 쓴다.
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9090}
    access-key: ${AWS_ACCESS_KEY_ID:foo}
    secret-key: ${AWS_SECRET_ACCESS_KEY:bar}
